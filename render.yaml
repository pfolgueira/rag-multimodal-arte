services:
  - type: web
    name: art-rag-backend
    runtime: python
    buildCommand: cd backend && pip install uv && uv pip install --system .
    startCommand: cd backend && uvicorn backend.api_chroma:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CHROMA_DB_PATH
        value: /opt/render/project/src/embeddings/chroma_db
      - key: IMAGE_BASE_URL
        sync: false
