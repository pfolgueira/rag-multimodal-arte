[project]
name = "rag-multimodal-backend"
version = "0.1.0"
description = "Backend API for Art-RAG multimodal search"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.34.0",
    "chromadb>=1.5.5",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "numpy>=2.4.2",
]

[tool.setuptools]
packages = ["."]
