[project]
name = "rag-multimodal"
version = "0.1.0"
description = "Multimodal semantic search over Rijksmuseum artwork using VLM-generated descriptions, vector embeddings (BGE-M3), ChromaDB/FAISS, FastAPI, and a React frontend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.59",
    "botocore>=1.42.59",
    "chromadb>=1.5.5",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.135.1",
    "google-genai>=1.66.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "kagglehub>=1.0.0",
    "litellm>=1.82.0",
    "matplotlib>=3.10.8",
    "mistralai>=1.12.4",
    "nest-asyncio>=1.6.0",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pillow>=12.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.2.3",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "transformers>=5.2.0",
]
[tool.setuptools]
packages = ["backend"]
